<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Frog Hop">
<meta name="theme-color" content="#C4EBE1">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
</head>
<body>
<!-- game:start -->
<title>Frog Hop Sums</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;700;800&display=swap">
<style>
/* Layout: one-screen pond app. Question card and frog number line sit above a chunky keypad; side by side when the iPad is landscape. */
:root{
  --water:#C4EBE1; --water-deep:#93D3C4; --shade:#7FBDAE; --paper:#FFFDF5;
  --ink:#1D3836; --ink-soft:#4B6A66; --ink-faint:rgba(29,56,54,.16);
  --frog:#4FA83D; --frog-dark:#2E7524; --lake:#3A86A8; --sun:#FFC63A; --sun-dark:#B97F05; --coral:#D9574A; --berry:#A65A9C;
  --display:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Andika","Trebuchet MS",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:linear-gradient(180deg,var(--water) 0%,var(--water-deep) 100%);background-color:var(--water);color:var(--ink);font-family:var(--body);font-size:18px;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;-webkit-appearance:none;appearance:none}
button:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
button:disabled{opacity:.5;cursor:default}
#app{height:100%;max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:14px;display:flex;flex-direction:column}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;gap:18px;overflow-y:auto;-webkit-overflow-scrolling:touch}

/* Home */
.home{align-items:center}
.brand{display:flex;align-items:center;gap:18px;justify-content:center;flex-wrap:wrap;text-align:left;padding-top:6px}
.hero-frog{width:clamp(96px,16vw,140px);height:auto;flex:none}
h1{font-family:var(--display);font-weight:800;font-size:clamp(42px,7.5vw,72px);line-height:.95;margin:0;color:var(--frog-dark);text-wrap:balance}
.tag{margin:6px 0 0;font-size:clamp(17px,2.4vw,22px);color:var(--ink-soft);font-weight:700}
.groups{display:grid;gap:20px;width:min(980px,100%)}
@media (min-width:900px) and (orientation:landscape){.groups{grid-template-columns:repeat(2,minmax(0,1fr))}}
.group{display:flex;flex-direction:column;gap:10px;min-width:0}
.group-h{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(22px,3vw,28px);color:var(--ink)}
.group-h span{font-family:var(--body);font-weight:700;font-size:.7em;color:var(--ink-soft);margin-left:6px}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mode{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--paper);border-radius:22px;box-shadow:0 6px 0 var(--shade);font-family:var(--display);font-weight:700;font-size:clamp(19px,2.6vw,25px);line-height:1.1;text-align:left;min-height:80px;transition:transform .08s}
.mode:active{transform:translateY(4px);box-shadow:0 2px 0 var(--shade)}
.mode small{display:block;font-family:var(--body);font-size:15px;font-weight:700;color:var(--ink-soft);margin-top:2px}
.mode.wide{grid-column:1/-1;justify-content:center;background:var(--sun);box-shadow:0 6px 0 var(--sun-dark)}
.mode.wide:active{box-shadow:0 2px 0 var(--sun-dark)}
.sym{flex:none;width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:30px;font-weight:800;color:#fff;line-height:1}
.s-add{background:var(--frog)} .s-sub{background:var(--lake)} .s-miss{background:var(--berry)} .s-test{background:var(--ink)}
.s-words{background:var(--lake);font-size:24px} .s-three{background:var(--frog)} .s-story{background:var(--coral);font-size:38px;padding-top:12px}
.s-mix{background:var(--frog-dark)}
.home-foot{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.chip{background:var(--paper);border-radius:999px;padding:10px 20px;font-weight:700;font-size:18px;box-shadow:0 4px 0 var(--shade);min-height:48px}
.chip:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shade)}
.remember{margin:0;color:var(--ink-soft);font-weight:700;text-align:center;font-size:16px}

/* Play */
.bar{display:flex;align-items:center;gap:12px;justify-content:space-between;flex:none}
.dots{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.dot{width:16px;height:16px;border-radius:50%;background:var(--ink-faint)}
.dot.now{background:var(--paper);box-shadow:0 0 0 3px var(--ink)}
.dot.ok{background:var(--sun);box-shadow:0 0 0 2px var(--sun-dark)}
.dot.miss{background:var(--coral)}
.score{display:flex;align-items:center;gap:4px;font-family:var(--display);font-weight:800;font-size:28px;min-width:76px;justify-content:flex-end;font-variant-numeric:tabular-nums}
.score svg{width:32px;height:32px}
.stage{flex:1;min-height:0;display:grid;gap:16px;grid-template-columns:minmax(0,1fr);align-content:start}
@media (min-width:900px) and (orientation:landscape){.stage{grid-template-columns:minmax(0,1.45fr) minmax(280px,1fr)}}
.left{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--paper);border-radius:28px;padding:18px 20px 14px;box-shadow:0 8px 0 var(--shade);text-align:center;container-type:inline-size}
.sum{font-family:var(--display);font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.sum.eq{display:flex;justify-content:center;align-items:center;gap:.2em;line-height:1.15;font-size:56px;font-size:clamp(34px,calc(150cqi / var(--n,8)),112px)}
.sum.words{font-family:var(--body);font-weight:700;font-size:clamp(24px,3.6vw,38px);line-height:1.7;text-wrap:balance;padding-block:6px}
.sum.story{font-family:var(--body);font-weight:700;font-size:clamp(20px,2.7vw,29px);line-height:1.45;text-align:left;font-variant-numeric:normal}
.story-t{margin:0;text-wrap:pretty}
.story-a{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:12px;font-family:var(--display);font-weight:800;font-size:clamp(40px,6vw,60px)}
.unit{font-size:.55em;color:var(--ink-soft)}
.sum.col{display:flex;justify-content:center;font-size:clamp(44px,8vw,72px);line-height:1.1}
.col{display:grid;justify-items:end}
.col .row{display:flex;gap:.35em;align-items:center}
.col i{font-style:normal;color:var(--ink-soft)}
.col .rule{width:100%;height:5px;background:var(--ink);border-radius:3px;margin-block:6px}
.box{display:inline-flex;align-items:center;justify-content:center;min-width:1.6em;height:1.15em;padding-inline:.15em;border:.06em dashed var(--frog);border-radius:.22em;background:#F2FAE9;color:var(--frog-dark);vertical-align:middle;line-height:1}
.sum.words .box{min-width:2.6em;height:1.4em;border-width:3px;font-family:var(--display);font-weight:800;font-size:1.1em;margin-inline:.1em}
.sum.col .box{min-width:2.2em}
.story-a .box{min-width:2.4em;border-width:4px}
.box.empty::after{content:"";width:4px;height:.6em;background:var(--frog-dark);border-radius:2px;animation:blink 1s steps(1) infinite}
.box.shown{border-style:solid;border-color:var(--coral);color:var(--coral);background:#FDECEA}
.card.good .box{border-style:solid;border-color:var(--sun-dark);background:#FFF3CC;color:var(--ink)}
.card.good{animation:pop .5s ease}
.card.bad .box{animation:shake .45s}
.msg{margin:10px 0 0;font-size:clamp(18px,2.5vw,23px);min-height:1.4em;color:var(--ink-soft);font-weight:700;text-wrap:balance}
.line-wrap{background:rgba(255,253,245,.45);border-radius:24px;padding:6px 8px}
.line-wrap svg{display:block;width:100%;height:auto;overflow:visible}
#line .water{stroke:#8CCDBE;stroke-width:28;stroke-linecap:round;fill:none}
#line .lily{fill:#7CC46A;stroke:#4E9A40;stroke-width:2}
#line .lily.ten{fill:var(--sun);stroke:var(--sun-dark)}
#line text{font-family:var(--display);font-weight:700;font-size:26px;fill:var(--ink-soft);text-anchor:middle}
#line text.st{fill:var(--ink);font-weight:800;font-size:30px}
#line text.later{opacity:0}
#line .base{stroke:var(--ink-soft);stroke-width:4;stroke-linecap:round;fill:none}
#line .tick{stroke:var(--ink-soft);stroke-width:4;stroke-linecap:round;fill:none}
#line .arc{fill:none;stroke:var(--sun-dark);stroke-width:4;stroke-linecap:round;stroke-dasharray:2 10}
#line text.hopn{font-size:20px;fill:var(--sun-dark)}
#line text.jumpn{font-size:30px;font-weight:800;fill:var(--sun-dark)}
.help{align-self:center;background:var(--paper);border-radius:999px;padding:12px 26px;font-family:var(--display);font-weight:700;font-size:22px;box-shadow:0 5px 0 var(--shade);display:flex;align-items:center;gap:10px;min-height:56px}
.help svg{width:34px;height:30px}
.help:active{transform:translateY(3px);box-shadow:0 2px 0 var(--shade)}
.pad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-content:start}
.key{font-family:var(--display);font-weight:800;font-size:clamp(32px,5vw,44px);background:var(--paper);border-radius:20px;box-shadow:0 6px 0 var(--shade);min-height:clamp(60px,8.4vh,88px);line-height:1}
.key:active{transform:translateY(4px);box-shadow:0 2px 0 var(--shade)}
.key.zero{grid-column:span 2}
.key.del{font-size:24px;color:var(--ink-soft)}
.key.go{grid-column:1/-1;background:var(--frog);color:#fff;box-shadow:0 6px 0 var(--frog-dark);font-size:clamp(28px,4.2vw,38px)}
.key.go:active{box-shadow:0 2px 0 var(--frog-dark)}

/* Results */
.results{align-items:center;justify-content:center;text-align:center}
.results h2,.book h2{font-family:var(--display);font-weight:800;font-size:clamp(38px,7vw,62px);line-height:1.05;margin:0;color:var(--frog-dark);text-wrap:balance}
.starrow{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.starrow svg{width:clamp(26px,6vw,46px);height:clamp(26px,6vw,46px)}
.star-on{fill:var(--sun);stroke:var(--sun-dark);stroke-width:1.2}
.star-off{fill:var(--ink-faint)}
.res-line{font-size:clamp(20px,3vw,26px);margin:0;font-weight:700}
.newsticker{display:flex;align-items:center;gap:16px;background:var(--paper);border-radius:24px;padding:12px 22px;box-shadow:0 6px 0 var(--shade);font-weight:700;font-size:21px;text-align:left}
.newsticker .big{font-size:58px;line-height:1;animation:stickerIn .7s cubic-bezier(.3,1.6,.5,1)}
.practise{background:rgba(255,253,245,.6);border-radius:20px;padding:12px 20px;max-width:680px;width:100%;text-align:left}
.practise h3{margin:0 0 4px;font-family:var(--display);font-size:22px}
.practise ul{margin:0;padding-left:1.2em;font-size:19px;line-height:1.5}
.res-actions{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;align-items:center}
.res-actions .key{padding-inline:40px;grid-column:auto;min-height:68px}

/* Sticker book */
.book{align-items:center}
.book-top{display:flex;justify-content:space-between;align-items:center;gap:12px;width:min(760px,100%)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:12px;width:min(760px,100%)}
.slot{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:40px;background:var(--paper);box-shadow:0 4px 0 var(--shade)}
.slot.empty{background:transparent;box-shadow:none;border:3px dashed var(--shade);color:var(--shade);font-size:22px;font-family:var(--display);font-weight:800}
.slot.gold{border:5px solid var(--sun)}
.book-note{margin:0;color:var(--ink-soft);font-weight:700;text-align:center}

@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.035)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes blink{50%{opacity:0}}
@keyframes stickerIn{from{transform:scale(.3) rotate(-25deg)}to{transform:scale(1) rotate(0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="frogSym" viewBox="-44 -46 88 74">
      <ellipse cx="-22" cy="19" rx="14" ry="7" fill="#2E7524"/>
      <ellipse cx="22" cy="19" rx="14" ry="7" fill="#2E7524"/>
      <ellipse cx="0" cy="4" rx="32" ry="22" fill="#4FA83D"/>
      <ellipse cx="0" cy="11" rx="20" ry="11" fill="#CDEB9A"/>
      <circle cx="-15" cy="-19" r="12" fill="#4FA83D"/>
      <circle cx="15" cy="-19" r="12" fill="#4FA83D"/>
      <circle cx="-15" cy="-20" r="8" fill="#ffffff"/>
      <circle cx="15" cy="-20" r="8" fill="#ffffff"/>
      <circle cx="-13" cy="-19" r="4" fill="#1D3836"/>
      <circle cx="17" cy="-19" r="4" fill="#1D3836"/>
      <circle cx="-23" cy="1" r="4" fill="#F29A8C" opacity=".75"/>
      <circle cx="23" cy="1" r="4" fill="#F29A8C" opacity=".75"/>
      <path d="M-13 -1 Q0 10 13 -1" stroke="#2E7524" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    </symbol>
    <symbol id="starSym" viewBox="0 0 24 24">
      <path d="M12 2.2l2.9 6.3 6.9.7-5.2 4.6 1.5 6.8L12 17.1l-6.1 3.5 1.5-6.8L2.2 9.2l6.9-.7z" stroke-linejoin="round"/>
    </symbol>
  </defs>
</svg>

<main id="app">
  <section id="home" class="screen home">
    <div class="brand">
      <svg class="hero-frog" viewBox="0 0 88 74" aria-hidden="true"><use href="#frogSym"/></svg>
      <div>
        <h1>Frog Hop Sums</h1>
        <p class="tag">Pick a game. The frog helps with the tricky ones.</p>
      </div>
    </div>
    <div class="groups">
      <div class="group">
        <h2 class="group-h">Up to 20 <span>for the test</span></h2>
        <div class="modes">
          <button class="mode" data-mode="add"><span class="sym s-add">+</span><span>Adding</span></button>
          <button class="mode" data-mode="sub"><span class="sym s-sub">&minus;</span><span>Taking away</span></button>
          <button class="mode" data-mode="miss20"><span class="sym s-miss">?</span><span>Missing numbers</span></button>
          <button class="mode" data-mode="mix20"><span class="sym s-mix">&plusmn;</span><span>Mix them up</span></button>
          <button class="mode wide" data-mode="test"><span class="sym s-test">&check;</span><span>Practice test<small>10 sums, no helper frog</small></span></button>
        </div>
      </div>
      <div class="group">
        <h2 class="group-h">Bigger sums <span>like the homework</span></h2>
        <div class="modes">
          <button class="mode" data-mode="words"><span class="sym s-words">Aa</span><span>Word sums</span></button>
          <button class="mode" data-mode="missbig"><span class="sym s-miss">?</span><span>Missing numbers</span></button>
          <button class="mode" data-mode="three"><span class="sym s-three">3</span><span>Add three numbers</span></button>
          <button class="mode" data-mode="story"><span class="sym s-story">&ldquo;</span><span>Story sums</span></button>
          <button class="mode wide" data-mode="hwmix"><span class="sym s-mix">+</span><span>Homework mix<small>A bit of everything</small></span></button>
        </div>
      </div>
    </div>
    <div class="home-foot">
      <button id="bookBtn" class="chip">Sticker book &middot; <b id="stickerCount">0</b></button>
      <button id="soundBtn" class="chip">Sound: on</button>
    </div>
    <p class="remember" id="remember" hidden></p>
  </section>

  <section id="play" class="screen play" hidden>
    <header class="bar">
      <button id="quitBtn" class="chip">Home</button>
      <div class="dots" id="dots" aria-label="Progress"></div>
      <div class="score" aria-label="Stars"><svg class="star-on"><use href="#starSym"/></svg><b id="starCount">0</b></div>
    </header>
    <div class="stage">
      <div class="left">
        <div class="card" id="card">
          <div class="sum eq" id="sum"></div>
          <p class="msg" id="msg" aria-live="polite"></p>
        </div>
        <div class="line-wrap" id="lineWrap"><svg id="line" viewBox="0 -10 1000 190" role="img" aria-label="Number line"></svg></div>
        <button id="helpBtn" class="help"><svg viewBox="0 0 88 74" aria-hidden="true"><use href="#frogSym"/></svg><span id="helpLabel">Show me the hops</span></button>
      </div>
      <div class="pad" id="pad"></div>
    </div>
  </section>

  <section id="results" class="screen results" hidden>
    <h2 id="resTitle"></h2>
    <div class="starrow" id="resStars"></div>
    <p class="res-line" id="resLine"></p>
    <div class="newsticker" id="resSticker"></div>
    <div class="practise" id="resPractise"></div>
    <div class="res-actions">
      <button id="againBtn" class="key go">Play again</button>
      <button id="homeBtn" class="chip">Home</button>
    </div>
  </section>

  <section id="book" class="screen book" hidden>
    <div class="book-top">
      <button id="bookBack" class="chip">Home</button>
      <h2>Sticker book</h2>
      <span style="width:84px"></span>
    </div>
    <p class="book-note" id="bookNote"></p>
    <div class="slots" id="slots"></div>
  </section>
</main>

<script>
(() => {
'use strict';
const ROUND = 10, KEY = 'froghop.v1';
const STICKERS = ['🐸','🦆','🐞','🦋','🐢','🐟','🐌','🌻','🐝','🦔','🦉','🐿️','🐛','🦢','🌷','🍄','🐠','🦊','🐇','🌈','🐳','🦜','🐙','⭐'];
const PRAISE = ["Ribbit! That's right!", 'Brilliant!', 'Super hopping!', 'Yes! Well done!', 'You got it!', 'Fantastic!'];
const HW = ['words', 'missbig', 'three', 'story'];
const reduced = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
const $ = id => document.getElementById(id);
const rnd = (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const wait = ms => new Promise(r => setTimeout(r, ms));
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* ---------- saved progress (stickers, tricky sums, sound) ---------- */
function load() {
  let s = null;
  try { s = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  s = s && typeof s === 'object' ? s : {};
  return {
    stickers: Array.isArray(s.stickers) ? s.stickers : [],
    tricky: s.tricky && typeof s.tricky === 'object' ? s.tricky : {},
    sound: s.sound !== false,
  };
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
const state = load();

/* ---------- sounds (made in the browser, no files) ---------- */
let ac = null;
function audio() {
  if (!state.sound) return null;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    return ac;
  } catch (e) { return null; }
}
function tone(f, at, dur, type, vol) {
  const a = audio(); if (!a) return;
  const t = a.currentTime + at, o = a.createOscillator(), g = a.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol || 0.14, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.05);
}
const sfx = {
  tap: () => tone(660, 0, 0.06, 'sine', 0.05),
  good: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.08, 0.25, 'triangle', 0.13)),
  bad: () => { tone(247, 0, 0.18, 'triangle', 0.12); tone(196, 0.15, 0.3, 'triangle', 0.12); },
  plip: k => tone(420 * Math.pow(2, Math.min(k, 14) / 12), 0, 0.1, 'sine', 0.1),
  fanfare: () => [523, 659, 784, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.11, 0.3, 'triangle', 0.13)),
};

/* ---------- frog helper plans ---------- */
// Adding an amount: hundreds, then tens, then ones (bridging through the next ten).
function jumpsAdd(v, amt) {
  const steps = [], h = Math.floor(amt / 100) * 100, t = Math.floor(amt % 100 / 10) * 10, o = amt % 10;
  if (h) { steps.push([v, v + h]); v += h; }
  if (t) { steps.push([v, v + t]); v += t; }
  if (o) {

// Up to 20: adding, taking away, missing numbers. Half of them cross 10, the tricky bit.

  else intro = `Start on ${start} and hop ${n} ${dir > 0 ? 'forward' : 'back'}.`;

    help: {

// Numbers like the homework sheet: 43 + 18, 70 + 44, 300 + 61, 600 + 400, 75 + 25.
function bigPair() {

// Missing numbers: 68 + ? = 100, ? + 16 = 300, 158 + ? = 165, ? + 19 = 84, ? + 800 = 2000 ...
function missQ() {

// Three numbers where two of them make a whole ten: 15 + 35 + 14, 16 + 4 + 9.

const STORIES = [

const GEN = {

  sub: () => smallQ('sub', 'sub', false),

const PAD_Y = 118;

function drawLine(q) {

  for (let i = 0; i < STICKERS.length; i++) {
    const got = state.stickers[i];
    s += got ? `<div class="slot${got.gold ? ' gold' : ''}">${STICKERS[i]}</div>` : `<div class="slot empty">${i + 1}</div>`;
  }
  $('slots').innerHTML = s;
  const n = state.stickers.length;
  $('bookNote').textContent = n >= STICKERS.length ? 'Your sticker book is full! Get 10 out of 10 to turn stickers gold.'
    : `${n} of ${STICKERS.length} stickers. Finish a round to win the next one. Get 10 out of 10 for a gold one.`;
  show('book');
}

/* ---------- wiring ---------- */
const pad = $('pad');
['1', '2', '3', '4', '5', '6', '7', '8', '9'].forEach(d => pad.insertAdjacentHTML('beforeend', `<button class="key" data-d="${d}">${d}</button>`));
pad.insertAdjacentHTML('beforeend', '<button class="key zero" data-d="0">0</button><button class="key del" data-act="del" aria-label="Delete">Delete</button><button class="key go" data-act="go">Check</button>');
pad.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.d) press(b.dataset.d); else if (b.dataset.act === 'del') del(); else check();
});
document.querySelectorAll('.mode').forEach(b => b.addEventListener('click', () => { audio(); startRound(b.dataset.mode); }));
$('helpBtn').addEventListener('click', onHelp);
$('quitBtn').addEventListener('click', () => { hopToken++; game = null; refreshHome(); show('home'); });
$('againBtn').addEventListener('click', () => startRound(game ? game.mode : 'add'));
$('homeBtn').addEventListener('click', () => { game = null; refreshHome(); show('home'); });
$('bookBtn').addEventListener('click', openBook);
$('bookBack').addEventListener('click', () => { refreshHome(); show('home'); });
$('soundBtn').addEventListener('click', () => { state.sound = !state.sound; save(); refreshHome(); if (state.sound) sfx.tap(); });
document.addEventListener('keydown', e => {
  if ($('play').hidden) return;
  if (/^[0-9]$/.test(e.key)) press(e.key);
  else if (e.key === 'Backspace') { e.preventDefault(); del(); }
  else if (e.key === 'Enter') { e.preventDefault(); check(); }
});
refreshHome(); show('home');
})();
</script>
<!-- game:end -->
</body>
</html>
